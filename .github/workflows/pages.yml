name: pages
# Deploys the static live demo: the timeline viewer with bundled run folders
# (web/timeline/demo, written by scripts/demo-export.sh). No kuru serve needed.
on:
  push:
    branches: [main]
    paths: ["web/timeline/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: web/timeline
        run: |
          npm ci
          npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/timeline/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
